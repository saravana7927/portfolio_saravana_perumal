<body>

  <!--
    - #MAIN
  -->

  <main>

    <!--
      - #SIDEBAR
    -->

    <aside class="sidebar" data-sidebar>

      <div class="sidebar-info">

        <figure class="avatar-box">
          <img src="./assets/images/my-avatar.png" alt="Saravana Perumal" width="80">
        </figure>

        <div class="info-content">
          <h1 class="name" title="" data-profile-name></h1>

          <p class="title" data-profile-headline></p>

          <div class="freelance-badge" data-profile-availability></div>
        </div>

        <button class="info_more-btn" data-sidebar-btn>
          <span>Show Contacts</span>

          <ion-icon name="chevron-down"></ion-icon>
        </button>

      </div>

      <div class="sidebar-info_more">

        <div class="separator"></div>

        <ul class="contacts-list">

          <li class="contact-item">

            <div class="icon-box">
              <ion-icon name="mail-outline"></ion-icon>
            </div>

            <div class="contact-info">
              <p class="contact-title">Email</p>

              <a href="#" class="contact-link" data-profile-email></a>
            </div>

          </li>

          <!-- Phone contact item: comment out or remove this li to remove phone across the site -->
          <li class="contact-item" id="contact-phone">

            <div class="icon-box">
              <ion-icon name="phone-portrait-outline"></ion-icon>
            </div>

            <div class="contact-info">
              <p class="contact-title">Phone</p>

              <a href="#" class="contact-link" data-profile-phone></a>
            </div>

          </li>

          <li class="contact-item">

            <div class="icon-box">
              <ion-icon name="location-outline"></ion-icon>
            </div>

            <div class="contact-info">
              <p class="contact-title">Location</p>

              <address data-profile-location></address>
            </div>

          </li>

        </ul>

        <div class="separator"></div>

        <ul class="social-list" data-profile-socials></ul>

        <!-- TODO: Add resume.pdf to assets/ to display the download button -->
        <!--
        <div class="separator"></div>
        <a href="./assets/resume.pdf" class="resume-btn" download>
          <ion-icon name="download-outline"></ion-icon>
          <span>Download Resume</span>
        </a>
        -->

      </div>

    </aside>





    <!--
      - #main-content
    -->

    <div class="main-content">

      <!--
        - #NAVBAR
      -->

      <nav class="navbar">

        <ul class="navbar-list">

          <li class="navbar-item">
            <button class="navbar-link active" data-nav-link data-page-target="about">About</button>
          </li>

          <li class="navbar-item">
            <button class="navbar-link" data-nav-link data-page-target="resume">Resume</button>
          </li>

          <li class="navbar-item">
            <button class="navbar-link" data-nav-link data-page-target="portfolio">Portfolio</button>
          </li>

          <!-- <li class="navbar-item">
            <button class="navbar-link" data-nav-link data-page-target="blog">Blog</button>
          </li> -->

          <li class="navbar-item">
            <button class="navbar-link" data-nav-link data-page-target="contact">Contact</button>
          </li>

        </ul>

      </nav>





      <!--
        - #ABOUT
      -->

      <article class="about  active" data-page="about">

        <header>
          <h2 class="h2 article-title">About me</h2>
        </header>

        <section class="about-text" data-about-text>
        </section>


        <!--
          - "what i'm doing" / services
        -->

        <section class="service">

          <h3 class="h3 service-title">What I'm doing</h3>

          <ul class="service-list" data-service-list></ul>

        </section>


        <!--
          - testimonials
        -->




        <!--
          - testimonials modal
        -->




        <!--
          - clients
        -->



      </article>





      <!--
        - #RESUME
      -->

      <article class="resume" data-page="resume">

        <header>
          <h2 class="h2 article-title">Resume</h2>
        </header>

        <section class="timeline">

          <div class="title-wrapper">
            <div class="icon-box">
              <ion-icon name="briefcase-outline"></ion-icon>
            </div>

            <h3 class="h3">Experience</h3>
          </div>

          <ol class="timeline-list" data-experience-list></ol>

        </section>

        <section class="timeline">

          <div class="title-wrapper">
            <div class="icon-box">
              <ion-icon name="book-outline"></ion-icon>
            </div>

            <h3 class="h3">Education</h3>
          </div>

          <ol class="timeline-list" data-education-list></ol>

        </section>


        <section class="skill">

          <h3 class="h3 skills-title">My skills</h3>

          <div class="skills-list content-card" data-skills-list></div>

        </section>

      </article>





      <!--
        - #PORTFOLIO
      -->

      <article class="portfolio" data-page="portfolio">

        <header>
          <h2 class="h2 article-title">Portfolio</h2>
        </header>

        <section class="projects">

          <ul class="filter-list" data-filter-list></ul>

          <div class="filter-select-box">

            <button class="filter-select" data-select>

              <div class="select-value" data-selecct-value>Select category</div>

              <div class="select-icon">
                <ion-icon name="chevron-down"></ion-icon>
              </div>

            </button>

            <ul class="select-list" data-select-list></ul>

          </div>

          <ul class="project-list" data-project-list></ul>

        </section>

      </article>





      <!--
        - #BLOG
      -->







      <!--
        - #CONTACT
      -->

      <article class="contact" data-page="contact">

        <header>
          <h2 class="h2 article-title">Contact</h2>
        </header>

        <section class="contact-form">

          <h3 class="h3 form-title">Contact Form</h3>

          <!-- TODO: Submit form once to receive encrypted token endpoint from FormSubmit (e.g. https://formsubmit.co/your-token-hash) to hide email from HTML source -->
          <form action="https://formsubmit.co/saravana.s.perumal@gmail.com" method="POST" class="form" data-form>
            <!-- Anti-spam & honeypot -->
            <input type="text" name="_honey" style="display:none">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <div class="input-wrapper">
              <input type="text" name="fullname" class="form-input" placeholder="Full name" required data-form-input>
              <input type="email" name="email" class="form-input" placeholder="Email address" required data-form-input>
            </div>

            <textarea name="message" class="form-input" placeholder="Your Message" required data-form-input></textarea>

            <button class="form-btn" type="submit" disabled data-form-btn>
              <ion-icon name="paper-plane"></ion-icon>
              <span>Send Message</span>
            </button>
          </form>

        </section>

      </article>

    </div>

  </main>






  <!--
